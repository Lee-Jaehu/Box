[project]
name = "rsb"
version = "0.1.0"
description = "릴스 세컨브레인 PoC (1단계 기술 검증)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "cryptography>=43",
  "yt-dlp>=2026.8.19",
  "openai>=1.50",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
local-whisper = ["faster-whisper>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
