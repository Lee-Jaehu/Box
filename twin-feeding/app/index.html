<style>
/* Layout: phone-first single column (max 560px), sticky header, fixed bottom tab bar. Night mode = amber-on-black for 3am feeds. */
:root {

  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111517; --surface: #192023; --sunk: #222A2E; --ink: #E4EAEA; --muted: #93A1A4; --line: #2B3438;
  --accent: #8E9CF0; --accent-ink: #10142A;
  --girl: #EB9470; --boy: #52B6C2;
  --ok: #6CC070; --warn: #E2A94C; --crit: #F0705F;
  --ok-bg: #1D2E20; --warn-bg: #33281A; --crit-bg: #3A1F1B;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111517; --surface: #192023; --sunk: #222A2E; --ink: #E4EAEA; --muted: #93A1A4; --line: #2B3438;
  --accent: #8E9CF0; --accent-ink: #10142A;
  --girl: #EB9470; --boy: #52B6C2;
  --ok: #6CC070; --warn: #E2A94C; --crit: #F0705F;
  --ok-bg: #1D2E20; --warn-bg: #33281A; --crit-bg: #3A1F1B;
  color-scheme: dark; }
/* 야간 화면: 파란빛을 뺀 호박색. 테마와 상관없이 우선 적용 */
:root[data-night="1"] {
  --bg: #090605; --surface: #140E0A; --sunk: #1E150F; --ink: #E9A868; --muted: #9A7048; --line: #2B1E14;
  --accent: #E9A868; --accent-ink: #120B06;

  --ok: #B9A15A; --warn: #E9A868; --crit: #E8705A;
  --ok-bg: #1C170C; --warn-bg: #241A0E; --crit-bg: #2A130E;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* tasks */

.bar { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; display: flex; }

.tablewrap { overflow-x: auto; margin: 0 -4px; }

svg .need { stroke: var(--boy); stroke-width: 1.5; fill: none; }
svg .lD { stroke: var(--girl); stroke-width: 2.5; fill: none; } svg .pD { fill: var(--girl); }
svg .lS { stroke: var(--boy); stroke-width: 2.5; fill: none; } svg .pS { fill: var(--boy); }
svg .birthD { stroke: var(--girl); stroke-dasharray: 3 4; opacity: .6; } svg .birthS { stroke: var(--boy); stroke-dasharray: 3 4; opacity: .6; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

/* forms */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; font-family: var(--f-num); font-size: 14px; }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; }
.stepper button { height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); font-size: 22px; }
.stepper output { text-align: center; font-family: var(--f-num); font-size: 30px; font-weight: 600; }
.code { font-family: var(--f-num); font-weight: 600; background: var(--sunk); padding: 2px 8px; border-radius: 6px; }

/* sheet */
#sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
#sheet .back { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
#sheet .panel { position: relative; background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
#sheet .panel header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#sheet .x { border: 0; background: var(--sunk); border-radius: 999px; width: 36px; height: 36px; font-size: 18px; flex: none; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 30; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
#toast.alert { background: var(--crit); color: #fff; font-size: 17px; }
.empty { text-align: center; padding: 24px 8px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }

@media (prefers-reduced-motion: no-preference) { .bigbtn, .btn, .qbtn { transition: transform .08s; } .bigbtn:active, .btn:active, .qbtn:active { transform: scale(.98); } }

<script id="logic">
/* LOGIC START — 순수 계산 함수 (DOM 없음, tests/logic.test.js에서 검증) */
const HOUR = 3600e3, DAY = 24 * HOUR;
const DEFAULT_CONFIG = {
  birthDate: '2026-11-06',
  names: { D: '딸', S: '아들' },
  birthG: { D: 2630, S: 2640 },
  sonOrderMl: 0,            // NICU 처방 ml/일 (0 = 아직 모름 → 체중 추정)
  mlPerKg: 150,             // 계획용 (소아과 확인)
  reserveDays: 2,           // 아들 몫으로 잠가둘 일수
  pumpBuffer: 1.2,          // 유축 목표 = 아들 필요량 × 1.2
  roomH: 4, homeFridgeH: 96, nicuFridgeH: 48, freezerD: 180, thawedH: 24,
  momSleep: { start: '21:45', end: '02:30' },
  dadSleep: { start: '02:30', end: '09:00' },
  spareSets: 4,
  th: { confirmed: false, removalsMin: 8, maxGapH: 5, wetMin: 6, stoolMin: 1, feedsMin: 8, feedGapH: 4, momTemp: 38.5, epds: 10, gainMin: 0 },
};

function mergeConfig(c) {
  const out = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  if (!c || typeof c !== 'object') return out;
  for (const k of Object.keys(c)) {
    if (c[k] && typeof c[k] === 'object' && !Array.isArray(c[k]) && out[k] && typeof out[k] === 'object') Object.assign(out[k], c[k]);
    else if (c[k] !== undefined && c[k] !== null) out[k] = c[k];
  }
  return out;
}
const pad = n => String(n).padStart(2, '0');
function dayKey(t) { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function birthTime(cfg) { const [y, m, d] = cfg.birthDate.split('-').map(Number); return new Date(y, m - 1, d).getTime(); }
function dayOfLife(t, cfg) { return Math.round((startOfDay(t) - birthTime(cfg)) / DAY); }
function hmMin(s) { const [h, m] = String(s).split(':').map(Number); return (h || 0) * 60 + (m || 0); }
function inWindow(t, win) {
  const d = new Date(t), m = d.getHours() * 60 + d.getMinutes(), a = hmMin(win.start), b = hmMin(win.end);
  return a <= b ? (m >= a && m < b) : (m >= a || m < b);
}
const isRemoval = e => e.type === 'session';
const isPump = e => e.type === 'session' && e.kind !== 'nurse';
const isNurse = e => e.type === 'session' && e.kind !== 'pump';
const sessionMl = e => (Number(e.mlL) || 0) + (Number(e.mlR) || 0);
const removalTimes = events => events.filter(isRemoval).map(e => e.t).sort((a, b) => a - b);

function latestWeight(events, baby) {
  let best = null;
  for (const e of events) if (e.type === 'weight' && e.baby === baby && (!best || e.t > best.t)) best = e;
  return best;
}
function need(events, cfg, baby) {
  if (baby === 'S' && Number(cfg.sonOrderMl) > 0) return { ml: Math.round(Number(cfg.sonOrderMl)), src: 'NICU 처방' };
  const w = latestWeight(events, baby);
  const g = w ? Number(w.g) : cfg.birthG[baby];
  return { ml: Math.round(g / 1000 * cfg.mlPerKg), src: (w ? '최근 체중' : '출생체중') + ' × ' + cfg.mlPerKg + 'ml/kg (추정)' };
}
function hasFullDay(events, now) { return events.some(e => e.t <= now - DAY); }

function stats24(events, now, cfg) {
  const from = now - DAY;
  const win = events.filter(e => e.t > from && e.t <= now);
  const all = removalTimes(events).filter(t => t <= now);
  const inWin = all.filter(t => t > from);
  const firstIdx = all.findIndex(t => t > from);
  const seq = firstIdx < 0 ? [] : all.slice(Math.max(0, firstIdx - 1));
  let longestGap = 0;
  for (let i = 1; i < seq.length; i++) longestGap = Math.max(longestGap, seq[i] - seq[i - 1]);
  const sinceLast = all.length ? now - all[all.length - 1] : null;
  const night = inWin.some(t => { const h = new Date(t).getHours(); return h >= 1 && h < 5; });
  const pumped = win.filter(isPump).reduce((s, e) => s + sessionMl(e), 0);
  const unmeasured = win.filter(e => isPump(e) && e.end && !e.processed).length;
  const dNurse = win.filter(e => isNurse(e)).length;
  const dBottles = win.filter(e => e.type === 'bottle' && e.baby === 'D');
  const dFeedTimes = win.filter(e => isNurse(e) || (e.type === 'bottle' && e.baby === 'D')).map(e => e.t);
  const lastDFeed = events.filter(e => (isNurse(e) || (e.type === 'bottle' && e.baby === 'D')) && e.t <= now).reduce((m, e) => Math.max(m, e.t), 0);
  const diapers = win.filter(e => e.type === 'diaper' && e.baby === 'D');
  const sNeed = need(events, cfg, 'S');
  return {
    removals: inWin.length, longestGap, sinceLast, night, pumped, unmeasured,
    dFeeds: dNurse + dBottles.length, dNurse, dFeedTimes,
    sinceDFeed: lastDFeed ? now - lastDFeed : null,
    formula: dBottles.filter(b => b.milk === 'formula').reduce((s, b) => s + (Number(b.ml) || 0), 0),
    ebmD: dBottles.filter(b => b.milk === 'ebm').reduce((s, b) => s + (Number(b.ml) || 0), 0),
    wet: diapers.filter(d => d.wet).length, stool: diapers.filter(d => d.stool).length,
    sNeed, pumpTarget: Math.round(sNeed.ml * cfg.pumpBuffer), full: hasFullDay(events, now),
  };
}

// 밤 공백: day 키의 전날 21시 ~ 당일 12시 사이에 끝나는 비우기 간격 중 최댓값 (엄마 최장 수면 추정)
function nightGap(events, key) {
  const [y, m, d] = key.split('-').map(Number);
  const s = new Date(y, m - 1, d).getTime();
  const lo = s - 3 * HOUR, hi = s + 12 * HOUR;
  const all = removalTimes(events);
  let best = 0;
  for (let i = 1; i < all.length; i++) if (all[i] >= lo && all[i] < hi) best = Math.max(best, all[i] - all[i - 1]);
  return best;
}

function dailySeries(events, cfg, now, n) {
  const out = [];
  const today = startOfDay(now);
  for (let i = n - 1; i >= 0; i--) {
    const s = new Date(today); s.setDate(s.getDate() - i); const start = s.getTime();
    const e2 = new Date(start); e2.setDate(e2.getDate() + 1); const end = e2.getTime();
    const key = dayKey(start);
    const ev = events.filter(e => e.t >= start && e.t < end);
    const dB = ev.filter(e => e.type === 'bottle' && e.baby === 'D');
    const dia = ev.filter(e => e.type === 'diaper' && e.baby === 'D');
    const taps = who => ev.filter(e => e.by === who).length + ev.filter(e => e.type === 'session' && e.endBy === who).length;
    const sends = ev.filter(e => e.type === 'nicu').reduce((s, e) => s + (Number(e.ml) || 0), 0);
    out.push({
      key, start, dol: dayOfLife(start, cfg), partial: start + DAY > now,
      removals: ev.filter(isRemoval).length,
      night: ev.filter(isRemoval).some(e => { const h = new Date(e.t).getHours(); return h >= 1 && h < 5; }),
      pumped: ev.filter(isPump).reduce((s, e) => s + sessionMl(e), 0),
      dFeeds: ev.filter(isNurse).length + dB.length,
      formula: dB.filter(b => b.milk === 'formula').reduce((s, b) => s + (Number(b.ml) || 0), 0),
      ebmD: dB.filter(b => b.milk === 'ebm').reduce((s, b) => s + (Number(b.ml) || 0), 0),
      wet: dia.filter(d => d.wet).length, stool: dia.filter(d => d.stool).length,
      nightGap: nightGap(events, key), momTaps: taps('mom'), dadTaps: taps('dad'), toNicu: sends,
      count: ev.length,
    });
  }
  return out;
}

function weightPoints(events, baby, cfg) {
  const pts = [{ t: birthTime(cfg), g: cfg.birthG[baby], birth: true }];
  for (const e of events) if (e.type === 'weight' && e.baby === baby) pts.push({ t: e.t, g: Number(e.g), src: e.src });
  return pts.sort((a, b) => a.t - b.t);
}
// 최근 days일 측정값의 최소제곱 기울기 (g/일). 출생점은 제외.
function weightSlope(events, baby, now, days) {
  const pts = events.filter(e => e.type === 'weight' && e.baby === baby && e.t > now - days * DAY && e.t <= now).map(e => ({ x: e.t / DAY, y: Number(e.g) }));
  if (pts.length < 2) return null;
  const span = Math.max(...pts.map(p => p.x)) - Math.min(...pts.map(p => p.x));
  if (span < 2) return null;
  const mx = pts.reduce((s, p) => s + p.x, 0) / pts.length, my = pts.reduce((s, p) => s + p.y, 0) / pts.length;
  let num = 0, den = 0;
  for (const p of pts) { num += (p.x - mx) * (p.y - my); den += (p.x - mx) ** 2; }
  return den ? num / den : null;
}

function bagExpiry(bag, cfg) {
  if (bag.state === 'fridge') return bag.pumpedAt + (bag.for === 'S' ? cfg.nicuFridgeH : cfg.homeFridgeH) * HOUR;
  if (bag.state === 'freezer') return bag.pumpedAt + cfg.freezerD * DAY;
  if (bag.state === 'thawed') return (bag.stateAt || bag.pumpedAt) + cfg.thawedH * HOUR;
  return null;
}
const ACTIVE = ['fridge', 'freezer', 'thawed'];
function inventory(bags, events, cfg, now) {
  const list = Object.values(bags).filter(b => ACTIVE.includes(b.state));
  const avail = list.filter(b => bagExpiry(b, cfg) > now);
  const expired = list.filter(b => bagExpiry(b, cfg) <= now);
  const total = avail.reduce((s, b) => s + (Number(b.ml) || 0), 0);
  const sNeed = need(events, cfg, 'S');
  const reserve = Math.round(sNeed.ml * cfg.reserveDays);
  return { avail, expired, total, reserve, surplus: total - reserve, sNeed,
    byState: s => avail.filter(b => b.state === s).reduce((a, b) => a + (Number(b.ml) || 0), 0) };
}
// 배분 규칙: 부족분 → 아들 우선, 딸은 분유 (설계서 1-4)
function allocate(bags, events, cfg, now, ml) {
  const st = stats24(events, now, cfg);
  const inv = inventory(bags, events, cfg, now);
  if (st.full && st.pumped < st.sNeed.ml) {
    return { milk: 'formula', rule: 3, reason: '최근 24시간 유축 ' + st.pumped + 'ml < 아들 필요 ' + st.sNeed.ml + 'ml. 모유는 전부 아들 몫', inv };
  }
  if (inv.surplus >= ml) {
    const order = { thawed: 0, fridge: 1, freezer: 2 };
    const pick = inv.avail.slice().sort((a, b) => (order[a.state] - order[b.state]) || (bagExpiry(a, cfg) - bagExpiry(b, cfg)))[0];
    return { milk: 'ebm', rule: 2, bag: pick, reason: '여유분 ' + inv.surplus + 'ml (보관 ' + inv.total + ' − 아들 예비 ' + inv.reserve + ')', inv };
  }
  return { milk: 'formula', rule: 2, reason: '여유분 ' + Math.max(0, inv.surplus) + 'ml < ' + ml + 'ml. 아들 예비분(' + inv.reserve + 'ml)을 먼저 채우는 중', inv };
}

function tasks(events, bags, cfg, now) {
  const out = [];
  for (const e of events) {
    if (e.type !== 'session') continue;
    if (!e.end) out.push({ kind: 'running', pri: 0, e });
    else if (e.kind !== 'nurse' && !e.processed) {
      const due = e.end + cfg.roomH * HOUR;
      out.push({ kind: 'process', pri: due < now + HOUR ? 1 : 3, e, due, overdue: due < now });
    }
  }
  const lastWash = events.filter(e => e.type === 'wash').reduce((m, e) => Math.max(m, e.t), 0);
  const used = events.filter(e => isPump(e) && e.end && e.t > lastWash).length;
  if (used > 0) out.push({ kind: 'wash', pri: used >= cfg.spareSets - 1 ? 2 : 6, n: used, urgent: used >= cfg.spareSets - 1 });
  const inv = inventory(bags, events, cfg, now);
  for (const b of inv.expired) out.push({ kind: 'expired', pri: 2, bag: b });
  for (const b of inv.avail) { const x = bagExpiry(b, cfg); if (x - now < 12 * HOUR && b.state !== 'freezer') out.push({ kind: 'expiring', pri: 3, bag: b, at: x }); }
  const sBags = inv.avail.filter(b => b.for === 'S' && b.state !== 'thawed');
  const sentToday = events.some(e => e.type === 'nicu' && dayKey(e.t) === dayKey(now));
  if (sBags.length && !sentToday) out.push({ kind: 'nicu', pri: 4, n: sBags.length, ml: sBags.reduce((s, b) => s + (Number(b.ml) || 0), 0) });
  const st = stats24(events, now, cfg);
  if (st.full && st.pumped < st.sNeed.ml) out.push({ kind: 'deficit', pri: 2, pumped: st.pumped, need: st.sNeed.ml });
  const w = latestWeight(events, 'D');
  if (!w || now - w.t > 3 * DAY) out.push({ kind: 'weigh', pri: 7, last: w });
  const ep = events.filter(e => e.type === 'momcheck' && e.epds !== undefined && e.epds !== null && e.epds !== '').reduce((m, e) => Math.max(m, e.t), 0);
  if (!ep || now - ep > 7 * DAY) out.push({ kind: 'epds', pri: 8 });
  return out.sort((a, b) => a.pri - b.pri);
}

// 연락 기준 (기본값은 소아과 확인 전). level: now(즉시) / today(당일 연락) / visit(진료 때 상의) / plan(공급 관리)
function flags(events, cfg, now) {
  const th = cfg.th, out = [];
  const st = stats24(events, now, cfg);
  const mc = events.filter(e => e.type === 'momcheck' && e.t > now - 2 * DAY).sort((a, b) => b.t - a.t)[0];
  if (mc) {
    if (Number(mc.epds10) >= 1) out.push({ level: 'now', who: 'mom', text: 'K-EPDS 10번 문항 응답 있음', act: '점수와 상관없이 바로 109(24시간) 또는 119' });
    const temp = Number(mc.temp);
    if (temp >= 39) out.push({ level: 'now', who: 'mom', text: '엄마 체온 ' + temp + '°C', act: '당일 진료/응급실' });
    else if (temp >= th.momTemp) out.push({ level: 'today', who: 'mom', text: '엄마 체온 ' + temp + '°C' + (mc.breast === 'red' ? ' + 유방 붉음·통증' : ''), act: '산과·모유수유 클리닉 당일 연락 (강한 마사지·과도한 유축 금지)' });
    else if (mc.breast === 'red') out.push({ level: 'today', who: 'mom', text: '유방 붉음·통증 기록', act: '24시간 넘게 지속되면 연락' });
    if (mc.epds !== undefined && mc.epds !== '' && Number(mc.epds) >= th.epds) out.push({ level: 'visit', who: 'mom', text: 'K-EPDS ' + mc.epds + '점 (기준 ' + th.epds + ')', act: '산과·정신건강의학과 상담 예약' });
    if (Number(mc.pain) >= 7) out.push({ level: 'visit', who: 'mom', text: '수유 통증 ' + mc.pain + '/10', act: 'IBCLC: 래치·깔때기 크기 점검' });
  }
  if (st.full) {
    if (st.wet < th.wetMin) out.push({ level: 'today', who: 'D', text: '최근 24시간 소변 ' + st.wet + '회 (기준 ' + th.wetMin + '회)', act: '소아과 당일 전화 (기록 누락이 아닌지 먼저 확인)' });
    if (st.stool < th.stoolMin) out.push({ level: 'today', who: 'D', text: '최근 24시간 대변 ' + st.stool + '회', act: '소아과 당일 전화' });
    if (st.dFeeds < th.feedsMin) out.push({ level: 'today', who: 'D', text: '최근 24시간 수유 ' + st.dFeeds + '회 (기준 ' + th.feedsMin + '회)', act: '소아과 당일 전화' });
    if (st.removals < th.removalsMin) out.push({ level: 'plan', who: 'mom', text: '젖 비우기 ' + st.removals + '회 (목표 ' + th.removalsMin + '회)', act: '공급 관리: 교대표 점검' });
    if (st.longestGap > th.maxGapH * HOUR) out.push({ level: 'plan', who: 'mom', text: '비우기 최장 공백 ' + (st.longestGap / HOUR).toFixed(1) + '시간 (목표 ≤' + th.maxGapH + ')', act: '공급 관리: 밤 교대 시각 점검' });
  }
  if (st.sinceDFeed !== null && st.sinceDFeed > th.feedGapH * HOUR) out.push({ level: 'today', who: 'D', text: '딸 마지막 수유 ' + (st.sinceDFeed / HOUR).toFixed(1) + '시간 전', act: '깨워서 수유 (소아과와 정한 최대 간격 ' + th.feedGapH + '시간)' });
  const w = latestWeight(events, 'D');
  if (w && dayOfLife(now, cfg) >= 14 && Number(w.g) < cfg.birthG.D) out.push({ level: 'visit', who: 'D', text: '생후 14일 이후에도 출생체중 미회복 (' + w.g + 'g < ' + cfg.birthG.D + 'g)', act: '소아과 진료' });
  const sl = weightSlope(events, 'D', now, 7);
  if (th.gainMin > 0 && sl !== null && sl < th.gainMin) out.push({ level: 'visit', who: 'D', text: '딸 7일 증가 ' + Math.round(sl) + 'g/일 (기준 ' + th.gainMin + ')', act: '소아과 진료' });
  const order = { now: 0, today: 1, visit: 2, plan: 3 };
  return out.sort((a, b) => order[a.level] - order[b.level]);
}
/* LOGIC END */
</script>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtT = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtMD = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate(); };
const fmtDur = ms => { if (ms === null || ms === undefined) return '—'; const m = Math.round(ms / 60000); return m < 60 ? m + '분' : Math.floor(m / 60) + '시간 ' + (m % 60) + '분'; };
const bagCode = t => { const d = new Date(t); return pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()); };
const NAME = b => b === 'D' ? state.cfg.names.D : b === 'S' ? state.cfg.names.S : '';
const STATE_KO = { fridge: '냉장', freezer: '냉동', thawed: '해동', nicu: 'NICU 보냄', used: '먹임', discard: '버림' };
const SIDE_KO = { L: '왼쪽', R: '오른쪽', B: '양쪽' };

const state = {
  events: [], bags: {}, cfg: mergeConfig(null), cfgRaw: null,
  me: ls.get('tf.me', null), tab: ls.get('tf.tab', 'now'), night: ls.get('tf.night', false),
  mode: 'loading', standby: false, side: null, seen: new Set(), booted: false, pending: false,
};

/* ---------- 저장소: 공유 DB, 없으면 이 기기 저장 ---------- */
const Store = {
  db: null, local: null,
  async init() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
    if (db) { this.db = db; state.mode = 'db-wait'; this.subscribe(); }
    else { state.mode = 'local'; this.local = ls.get('tf.data', { days: {}, bags: {}, config: null }); this.applyLocal(); }
    render();
  },
  subscribe() {
    const timer = setTimeout(() => { if (state.mode === 'db-wait') { state.mode = 'db-slow'; render(); } }, 10000);
    const ok = snap => { if (!snap.metadata.fromCache) { clearTimeout(timer); if (state.mode !== 'db') { state.mode = 'db'; } } };
    const fail = e => { clearTimeout(timer); state.mode = 'db-error'; state.err = e && e.code; render(); };
    this.db.collection('days').onSnapshot(snap => {
      const evs = [];
      for (const d of snap.docs) { const m = (d.data() || {}).events || {}; for (const id in m) { const e = m[id]; if (e && !e.deleted) evs.push(Object.assign({ id }, e)); } }
      ok(snap); setEvents(evs);
    }, fail);
    this.db.collection('bags').onSnapshot(snap => {
      const b = {}; for (const d of snap.docs) { const v = d.data(); if (v && !v.deleted) b[d.id] = Object.assign({ id: d.id }, v); }
      ok(snap); state.bags = b; render();
    }, fail);
    this.db.doc('config/main').onSnapshot(snap => { ok(snap); state.cfgRaw = snap.exists ? snap.data() : null; state.cfg = mergeConfig(state.cfgRaw); render(); }, fail);
  },
  applyLocal() {
    const evs = [];
    for (const k in this.local.days) for (const id in this.local.days[k]) { const e = this.local.days[k][id]; if (!e.deleted) evs.push(Object.assign({ id }, e)); }
    state.bags = Object.fromEntries(Object.entries(this.local.bags).filter(([, b]) => !b.deleted).map(([id, b]) => [id, Object.assign({ id }, b)]));
    state.cfgRaw = this.local.config; state.cfg = mergeConfig(this.local.config);
    setEvents(evs);
  },
  saveLocal() { ls.set('tf.data', this.local); this.applyLocal(); },
  async addEvent(ev) {
    const id = ev.id || uid(); const body = Object.assign({}, ev); delete body.id;
    const key = dayKey(ev.t);
    if (!this.db) { (this.local.days[key] = this.local.days[key] || {})[id] = body; this.saveLocal(); return id; }
    const ref = this.db.doc('days/' + key);
    try { await ref.update({ events: { [id]: body } }); }
    catch (e) {
      if (e && e.code === 'invalid_argument') {
        const s = await ref.get();
        if (s.exists) await ref.update({ events: { [id]: body } });
        else await ref.set({ date: key, events: { [id]: body } });
      } else throw e;
    }
    return id;
  },
  async patchEvent(ev, patch) {
    const key = dayKey(ev.t);
    if (!this.db) { const d = this.local.days[key]; if (d && d[ev.id]) Object.assign(d[ev.id], patch); this.saveLocal(); return; }
    await this.db.doc('days/' + key).update({ events: { [ev.id]: patch } });
  },
  async setBag(bag) {
    const body = Object.assign({}, bag); delete body.id;
    if (!this.db) { this.local.bags[bag.id] = body; this.saveLocal(); return; }
    await this.db.doc('bags/' + bag.id).set(body);
  },
  async patchBag(id, patch) {
    if (!this.db) { Object.assign(this.local.bags[id], patch); this.saveLocal(); return; }
    await this.db.doc('bags/' + id).update(patch);
  },
  async setConfig(cfg) {
    if (!this.db) { this.local.config = cfg; this.saveLocal(); return; }
    await this.db.doc('config/main').set(cfg);
  },
};
async function act(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) {
    const code = e && e.code;
    toast(code === 'invalid_argument' ? '기록 권한이 없어요. 링크 공유 설정에서 편집 권한을 받아야 해요.' : code === 'quota_exceeded' ? '저장 공간이 찼어요.' : '저장하지 못했어요. 잠시 후 다시 눌러 주세요.', true);
  }
}

function setEvents(evs) {
  evs.sort((a, b) => a.t - b.t);
  const prevBooted = state.booted;
  for (const e of evs) if (e.type === 'session' && !e.end && !state.seen.has(e.id)) {
    state.seen.add(e.id);
    if (prevBooted && state.me === 'dad' && e.by !== 'dad' && state.standby && !inWindow(Date.now(), state.cfg.dadSleep)) alertDad(e);
  }
  state.events = evs; state.booted = true; render();
}

/* ---------- 아빠 대기 모드: 화면 켜둠 + 소리 ---------- */
let wakeLock = null, audio = null;
async function lockScreen() { try { wakeLock = await navigator.wakeLock.request('screen'); } catch { wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (state.standby && document.visibilityState === 'visible') lockScreen(); });
function chime() {
  if (!audio) return;
  const t0 = audio.currentTime;
  [[660, 0], [880, .28], [660, .56]].forEach(([f, d]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f; o.type = 'sine'; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.35, t0 + d + .03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + .25);
    o.start(t0 + d); o.stop(t0 + d + .27);
  });
}
function alertDad(e) {
  chime(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
  toast('엄마 ' + (e.kind === 'pump' ? '유축' : '수유+유축') + ' 시작 · 물 한 컵, 끝나면 ' + state.cfg.roomH + '시간 안에 처리', true, 12000);
}

/* ---------- 공통 UI ---------- */
let toastTimer;
function toast(msg, alert, ms) {
  const el = $('#toast'); el.textContent = msg; el.className = alert ? 'alert' : ''; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms || 2600);
}
function openSheet(html, bind) {
  $('#panel').innerHTML = html; $('#sheet').hidden = false;
  if (bind) bind($('#panel'));
  const f = $('#panel').querySelector('[autofocus]'); if (f) f.focus();
}
function closeSheet() { $('#sheet').hidden = true; $('#panel').innerHTML = ''; if (state.pending) render(); }
$('#sheet').addEventListener('click', e => { if (e.target.dataset.close) closeSheet(); });
function sheetHead(title, sub) { return '<header><div><h3>' + title + '</h3>' + (sub ? '<p class="muted small">' + sub + '</p>' : '') + '</div><button class="x" data-close="1" aria-label="닫기">×</button></header>'; }
function chips(name, opts, val) {
  return '<div class="chips" data-chips="' + name + '">' + opts.map(([v, l]) => '<button type="button" data-v="' + esc(v) + '" aria-pressed="' + (String(v) === String(val)) + '">' + esc(l) + '</button>').join('') + '</div>';
}
function bindChips(root, name, onPick) {
  root.querySelectorAll('[data-chips="' + name + '"] button').forEach(b => b.addEventListener('click', () => {
    root.querySelectorAll('[data-chips="' + name + '"] button').forEach(x => x.setAttribute('aria-pressed', x === b));
    onPick(b.dataset.v);
  }));
}

/* ---------- 기록 동작 ---------- */
const running = () => state.events.filter(e => e.type === 'session' && !e.end).sort((a, b) => b.t - a.t)[0];
function suggestSide() {
  const last = state.events.filter(isNurse).sort((a, b) => b.t - a.t)[0];
  if (!last || !last.side) return 'L';
  return last.side === 'L' ? 'R' : 'L';
}

    root.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {

function pumpChart(ser, target, needMl) {

}

    reportTable(d) + '<p class="note">* 오늘(진행 중). 빨간 숫자 = 기준 미달 (기준: 비우기 ' + cfg.th.removalsMin + '회, 유축 ≥ 아들 필요량, 딸 수유 ' + cfg.th.feedsMin + '회, 소변 ' + cfg.th.wetMin + '회, 대변 ' + cfg.th.stoolMin + '회' + (cfg.th.confirmed ? ', 소아과 확인됨' : ', 소아과 확인 전 기본값') + '). 밤공백 = 엄마 최장 수면 추정.</p>';
  if (d.fl.length) h += '<div class="plain">' + d.fl.map(flagHtml).join('') + '</div>';
  if (d.mc.length) h += '<p class="small"><b>엄마</b> ' + d.mc.map(m => fmtMD(m.t) + ' ' + esc(describe(m).replace('엄마 상태', ''))).join(' · ') + '</p>';
  if (d.notes.length) h += '<p class="small"><b>메모</b> ' + d.notes.map(n => fmtMD(n.t) + ' ' + esc(n.text)).join(' · ') + '</p>';
  h += '</section><section class="card"><h2>파일로 저장</h2><div class="grid2"><button class="btn ghost" id="dl-html">리포트 (HTML)</button><button class="btn ghost" id="dl-csv">전체 기록 (CSV)</button></div><p class="note">HTML은 브라우저에서 열어 인쇄할 수 있어요. 화면 캡처로 보여줘도 돼요.</p></section>';
  return h;
}
async function download(kind) {
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (!dl) { toast('이 화면에서는 파일 저장을 쓸 수 없어요. 화면 캡처를 써 주세요.', true); return; }
  const d = reportData(), stamp = dayKey(d.now);
  let filename, data;
  if (kind === 'csv') {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const lines = [['시각', '종류', '아기', '기록자', '내용', 'ml', '원본'].map(q).join(',')];
    for (const e of state.events) lines.push([new Date(e.t).toLocaleString('ko-KR'), e.type, NAME(e.baby), e.by, describe(e), e.type === 'session' ? sessionMl(e) : (e.ml ?? ''), JSON.stringify(e)].map(q).join(','));
    filename = 'twin-feeding-' + stamp + '.csv'; data = '﻿' + lines.join('\n');
  } else {
    const body = $('#main').innerHTML.split('<section class="card"><h2>파일로 저장')[0];
    filename = 'twin-feeding-report-' + stamp + '.html';
    data = '<!doctype html><meta charset="utf-8"><title>쌍둥이 수유 리포트 ' + stamp + '</title><style>body{font-family:system-ui,"Malgun Gothic",sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#1B262A}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #ccc;padding:6px;text-align:right}th:first-child,td:first-child{text-align:left}.bad{color:#BC3426;font-weight:700}.flag{padding:8px 10px;border-radius:8px;background:#F7ECD9;margin:6px 0}.flag.now{background:#F8E1DE}.flag span{display:block;font-size:13px}.note,.muted{color:#5B6A6E;font-size:12px}h2{font-size:15px}</style>' + body;
  }
  try { await dl.save({ filename, data }); } catch (e) { if (e && e.code !== 'declined') toast('저장하지 못했어요 (' + (e.code || '오류') + ')', true); }
}

/* ---------- 화면: 설정 ---------- */
function viewSettings() {
  const c = state.cfg;
  const f = (id, label, val, hint, mode) => '<label class="f">' + label + '<input id="' + id + '" value="' + esc(val) + '" ' + (mode ? 'inputmode="' + mode + '"' : '') + '>' + (hint ? '<span class="note">' + hint + '</span>' : '') + '</label>';
  const modeTxt = { db: '공유 중: 이 링크를 연 가족 모두가 같은 기록을 봐요', 'db-wait': '공유 저장소에 연결하는 중', 'db-slow': '공유 저장소 응답이 늦어요. 기록은 연결되면 반영돼요', 'db-error': '공유 저장소 오류 (' + esc(state.err || '') + ')', local: '이 기기에만 저장 중 (공유 안 됨)', loading: '불러오는 중' }[state.mode];
  return '<section class="card"><h2>' + NAME('S') + ' NICU 처방</h2>' +
    f('sonOrderMl', '아들 하루 처방량 (ml/일)', c.sonOrderMl || '', '회당 ml × 하루 횟수. 비워두면 체중 × ' + c.mlPerKg + 'ml/kg 추정값을 써요. 처방이 바뀌면 바로 고쳐 주세요.', 'numeric') +
    '<div class="grid2">' + f('reserveDays', '아들 예비분 (일)', c.reserveDays, '', 'decimal') + f('pumpBuffer', '유축 목표 배수', c.pumpBuffer, '아들 필요량 × 이 값', 'decimal') + '</div></section>' +
    '<section class="card"><h2>보관 기한</h2><div class="grid2">' +
    f('nicuFridgeH', 'NICU용 냉장 (시간)', c.nicuFridgeH, '병원 규정으로 바꾸세요', 'numeric') + f('homeFridgeH', '집용 냉장 (시간)', c.homeFridgeH, 'CDC·ABM: 96시간', 'numeric') +
    f('freezerD', '냉동 (일)', c.freezerD, '권장 180일', 'numeric') + f('thawedH', '해동 후 (시간)', c.thawedH, '냉장 해동 후 24시간', 'numeric') +
    f('roomH', '실온 처리 기한 (시간)', c.roomH, '', 'numeric') + f('spareSets', '유축 부품 세트 수', c.spareSets, '', 'numeric') + '</div></section>' +
    '<section class="card"><h2>교대 시간</h2><div class="grid2">' +
    f('momStart', '엄마 보호 수면 시작', c.momSleep.start) + f('momEnd', '엄마 보호 수면 끝', c.momSleep.end) +
    f('dadStart', '아빠 수면 시작 (알림 무음)', c.dadSleep.start) + f('dadEnd', '아빠 수면 끝', c.dadSleep.end) + '</div></section>' +
    '<section class="card"><h2>연락 기준값</h2><p class="note">소아과·산과에서 숫자를 확인받은 뒤 고치고 아래를 체크하세요.</p><div class="grid2">' +
    f('wetMin', '딸 소변 최소 (24시간)', c.th.wetMin, '', 'numeric') + f('stoolMin', '딸 대변 최소', c.th.stoolMin, '', 'numeric') +
    f('feedsMin', '딸 수유 최소 횟수', c.th.feedsMin, '', 'numeric') + f('feedGapH', '딸 최대 수유 간격 (시간)', c.th.feedGapH, '', 'decimal') +
    f('gainMin', '딸 최소 증가 (g/일, 0=끔)', c.th.gainMin, '', 'numeric') + f('momTemp', '엄마 체온 기준 °C', c.th.momTemp, '', 'decimal') +
    f('removalsMin', '젖 비우기 목표 (회)', c.th.removalsMin, '', 'numeric') + f('maxGapH', '최장 공백 목표 (시간)', c.th.maxGapH, '', 'decimal') +
    f('epdsTh', 'K-EPDS 기준 점수', c.th.epds, '', 'numeric') + f('mlPerKg', '계획용 ml/kg/일', c.mlPerKg, '', 'numeric') + '</div>' +
    '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="confirmed" style="width:20px;height:20px" ' + (c.th.confirmed ? 'checked' : '') + '> 소아과 확인 완료</label></section>' +
    '<section class="card"><h2>아기</h2><div class="grid2">' + f('nameD', '첫째 이름', c.names.D) + f('nameS', '둘째 이름', c.names.S) + f('birthD', '첫째 출생체중 g', c.birthG.D, '', 'numeric') + f('birthS', '둘째 출생체중 g', c.birthG.S, '', 'numeric') + '</div>' +
    '<button class="btn wide" id="saveCfg">설정 저장</button></section>' +
    '<section class="card"><h2>저장 상태</h2><p class="small">' + modeTxt + '</p><p class="note">아내도 같은 기록을 쓰려면 이 페이지를 아내에게 공유하고 편집 권한을 주세요. 이 폰의 역할(엄마/아빠)과 야간 화면은 폰마다 따로 기억해요.</p></section>';
}
function saveSettings() {
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const n = (id, d) => { const x = Number(v(id)); return Number.isFinite(x) && v(id) !== '' ? x : d; };
  const hm = (id, d) => /^\d{1,2}:\d{2}$/.test(v(id)) ? v(id).padStart(5, '0') : d;
  const c = state.cfg;
  const cfg = {
    birthDate: c.birthDate, names: { D: v('nameD') || c.names.D, S: v('nameS') || c.names.S },
    birthG: { D: n('birthD', c.birthG.D), S: n('birthS', c.birthG.S) },
    sonOrderMl: n('sonOrderMl', 0), mlPerKg: n('mlPerKg', c.mlPerKg), reserveDays: n('reserveDays', c.reserveDays), pumpBuffer: n('pumpBuffer', c.pumpBuffer),
    roomH: n('roomH', c.roomH), homeFridgeH: n('homeFridgeH', c.homeFridgeH), nicuFridgeH: n('nicuFridgeH', c.nicuFridgeH), freezerD: n('freezerD', c.freezerD), thawedH: n('thawedH', c.thawedH),
    momSleep: { start: hm('momStart', c.momSleep.start), end: hm('momEnd', c.momSleep.end) }, dadSleep: { start: hm('dadStart', c.dadSleep.start), end: hm('dadEnd', c.dadSleep.end) },
    spareSets: n('spareSets', c.spareSets),
    th: { confirmed: document.getElementById('confirmed').checked, removalsMin: n('removalsMin', c.th.removalsMin), maxGapH: n('maxGapH', c.th.maxGapH), wetMin: n('wetMin', c.th.wetMin), stoolMin: n('stoolMin', c.th.stoolMin), feedsMin: n('feedsMin', c.th.feedsMin), feedGapH: n('feedGapH', c.th.feedGapH), momTemp: n('momTemp', c.th.momTemp), epds: n('epdsTh', c.th.epds), gainMin: n('gainMin', c.th.gainMin) },
  };
  act(() => Store.setConfig(cfg), '설정을 저장했어요');
}

/* ---------- 렌더 ---------- */
function render() {
  const ae = document.activeElement;
  if (ae && $('#main').contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type !== 'checkbox') { state.pending = true; return; }
  state.pending = false;
  document.documentElement.dataset.night = state.night ? '1' : '0';
  $('#night').setAttribute('aria-pressed', state.night); $('#night').className = 'chip' + (state.night ? ' on' : '');
  $('#me-mom').setAttribute('aria-pressed', state.me === 'mom'); $('#me-dad').setAttribute('aria-pressed', state.me === 'dad');
  $('#dol').textContent = '생후 ' + dayOfLife(Date.now(), state.cfg) + '일';
  const sy = $('#sync'), m = state.mode;
  sy.innerHTML = '<span class="dot ' + (m === 'db' ? 'ok' : m === 'local' || m === 'db-slow' || m === 'db-error' ? 'warn' : '') + '"></span>' + ({ db: '공유됨', 'db-wait': '연결 중', 'db-slow': '연결 지연', 'db-error': '연결 오류', local: '이 기기만', loading: '불러오는 중' }[m]);
  const views = { now: viewNow, status: viewStatus, stock: viewStock, report: viewReport, settings: viewSettings };
  $('#main').innerHTML = (views[state.tab] || viewNow)();
  document.querySelectorAll('nav.tabs button').forEach(b => {
    b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false');
    const old = b.querySelector('.badge'); if (old) old.remove();
  });
  const urgent = tasks(state.events, state.bags, state.cfg, Date.now()).filter(t => t.kind === 'process' || t.kind === 'expired' || t.kind === 'deficit' || (t.kind === 'wash' && t.urgent)).length;
  if (urgent && state.me === 'dad') { const b = document.querySelector('nav.tabs [data-tab="now"]'); const s = document.createElement('span'); s.className = 'badge'; s.textContent = urgent; b.appendChild(s); }
  tick();
}
function tick() {
  const r = running(), el = document.getElementById('clock');
  if (r && el) { const s = Math.floor((Date.now() - r.t) / 1000); el.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
}
setInterval(tick, 1000);
setInterval(() => { if ($('#sheet').hidden) render(); }, 30000);
document.addEventListener('focusout', () => setTimeout(() => { if (state.pending && $('#sheet').hidden) render(); }, 0));

/* ---------- 이벤트 위임 ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button, input[type=checkbox]'); if (!b) return;
  const d = b.dataset;
  if (b.closest('nav.tabs') && d.tab) { state.tab = d.tab; ls.set('tf.tab', d.tab); render(); window.scrollTo(0, 0); return; }
  if (b.id === 'me-mom' || b.id === 'me-dad' || d.me) { state.me = d.me || (b.id === 'me-mom' ? 'mom' : 'dad'); ls.set('tf.me', state.me); render(); return; }
  if (b.id === 'night') { state.night = !state.night; ls.set('tf.night', state.night); render(); return; }
  if (b.closest('#panel')) return;
  if (d.start) return startSession(d.start);
  if (d.end) { const r = state.events.find(x => x.id === d.end); if (r) endSession(r); return; }
  if (d.cancel) { const r = state.events.find(x => x.id === d.cancel); if (r) cancelSession(r); return; }
  if (d.side) { state.side = d.side; render(); return; }
  if (d.proc) { const r = state.events.find(x => x.id === d.proc); if (r) processSheet(r); return; }
  if (d.wash) return washDone(Number(d.wash));
  if (d.bag) { const bg = state.bags[d.bag]; if (bg) bagSheet(bg); return; }
  if (d.ev) { const r = state.events.find(x => x.id === d.ev); if (r) eventSheet(r); return; }
  if (d.go) { state.tab = d.go; ls.set('tf.tab', d.go); render(); return; }
  if (d.pick) { if (b.checked) picked.add(d.pick); else picked.delete(d.pick); render(); return; }
  if (b.id === 'send') {
    const sel = [...picked].map(id => state.bags[id]).filter(Boolean); if (!sel.length) return;
    const now = Date.now(), ml = sel.reduce((s, x) => s + x.ml, 0);
    await act(async () => { for (const x of sel) await Store.patchBag(x.id, { state: 'nicu', stateAt: now }); await Store.addEvent({ type: 'nicu', bagIds: sel.map(x => x.id), ml, t: now, by: state.me || 'dad' }); }, 'NICU 배송 ' + ml + 'ml 기록');
    picked = new Set(); render(); return;
  }
  if (b.id === 'standby') {
    state.standby = !state.standby;
    if (state.standby) { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); await audio.resume(); chime(); } catch {} lockScreen(); }
    else if (wakeLock) { try { wakeLock.release(); } catch {} wakeLock = null; }
    render(); return;
  }
  if (b.id === 'saveCfg') return saveSettings();
  if (b.id === 'dl-html') return download('html');
  if (b.id === 'dl-csv') return download('csv');
  switch (d.q) {
    case 'wet': return quickDiaper(true, false);
    case 'stool': return quickDiaper(false, true);
    case 'both': return quickDiaper(true, true);
    case 'bottle': return bottleSheet();
    case 'weight': return weightSheet();
    case 'mom': return momSheet();
    case 'note': return noteSheet();
  }
});

render();
Store.init();
})();
</script>
