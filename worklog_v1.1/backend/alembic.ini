[alembic]
script_location = migrations
# Keep this file ASCII only: Alembic reads it with the system codepage (cp949 on Korean Windows).
# The DB URL is injected by app.migrate.upgrade() from Settings; for manual runs pass -x url=sqlite:///...
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
