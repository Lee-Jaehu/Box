<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간업무 PPT 테스트</title>
<style>
  :root { --ink:#1f2328; --muted:#6b7280; --line:#d8dde3; --bg:#f5f6f8; --card:#fff; --accent:#0b57d0; --blue:#0000ff; --warn:#b45309; --bad:#b42318; --ok:#067647; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"LG스마트체 Regular","LG Smart_H","Malgun Gothic",sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  header { background:#202124; color:#fff; padding:12px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; font-weight:600; }
  header label { font-size:13px; color:#cfd3d8; }
  header select, header input { margin-left:6px; padding:5px 8px; border-radius:6px; border:1px solid #555; background:#2b2c2f; color:#fff; }
  header .spacer { flex:1; }
  main { max-width:1180px; margin:18px auto; padding:0 16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .card h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .step { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; }
  table.list { width:100%; border-collapse:collapse; font-size:13px; }
  table.list th, table.list td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  table.list tr.row { cursor:pointer; }
  table.list tr.row:hover { background:#f0f4ff; }
  table.list tr.excluded td { color:#9aa0a6; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; background:#e8f0fe; color:var(--accent); }
  .tag.x { background:#f1f3f4; color:#80868b; }
  .grid { display:grid; grid-template-columns: 140px 1fr 140px 1fr; gap:8px 12px; align-items:center; }
  .grid label { color:var(--muted); font-size:13px; }
  .grid .full { grid-column: 2 / 5; }
  input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; width:100%; }
  textarea { min-height:70px; resize:vertical; }
  textarea.mono, pre { font-family: Consolas, "D2Coding", monospace; font-size:12px; }
  .buttons { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  button { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:10px; padding:8px 12px; border-radius:6px; display:none; white-space:pre-wrap; }
  .msg.show { display:block; }
  .msg.ok { background:#ecfdf3; color:var(--ok); }
  .msg.err { background:#fef3f2; color:var(--bad); }
  .msg.info { background:#eff4ff; color:var(--accent); }
  pre { background:#f8f9fa; border:1px solid var(--line); border-radius:6px; padding:10px; white-space:pre-wrap; max-height:360px; overflow:auto; margin:6px 0 0; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .files a { margin-right:14px; }
  .hint { color:var(--muted); font-size:12px; margin-top:4px; }
  .hidden { display:none; }
  @media (max-width: 860px) { .grid { grid-template-columns: 110px 1fr; } .grid .full { grid-column: 2 / 3; } .two { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>주간업무 PPT 테스트</h1>
  <label>과제 <select id="project"></select></label>
  <label>주차 <input id="week" value="2026-W40" size="9" pattern="\d{4}-W\d{2}"></label>
  <button id="load">불러오기</button>
  <label>AI <select id="mode"><option value="mock">응답 붙여넣기(mock)</option><option value="live">EXAONE live</option></select></label>
  <span class="spacer"></span>
  <button id="reset" class="danger">작업공간 초기화</button>
</header>
<main>
  <section class="card">
    <h2><span class="step">1</span> Daily 메모 <span id="range" class="hint"></span></h2>
    <table class="list"><thead><tr><th style="width:90px">날짜</th><th style="width:70px">작성자</th><th style="width:70px">분류</th><th>본문</th><th style="width:90px">상태</th></tr></thead>
      <tbody id="dailies"></tbody></table>
    <h2 style="margin-top:18px">메모 입력 <span id="editing" class="hint">새 메모</span></h2>
    <div class="grid">
      <label>날짜</label><input id="f-date" type="date">
      <label>작성자 ID</label><input id="f-author" value="ljh" placeholder="예: ljh">
      <label>공개 범위</label><select id="f-visibility"><option value="project">과제 (정리 대상)</option><option value="private">개인 메모 (제외)</option></select>
      <label>카테고리</label><select id="f-category"><option value="">(선택 안 함)</option><option>DEV</option><option>ROLL</option><option>OPS</option><option>INV</option><option>DATA</option><option>RPT</option></select>
      <label>본문</label><textarea id="f-text" class="full" placeholder="구어체 메모 그대로 적어도 됩니다"></textarea>
      <label>표 제목</label><input id="f-table-title" class="full" placeholder="(선택) 예: 재료교체 위치 불량률">
      <label>표 값</label><textarea id="f-table" class="full mono" placeholder="(선택) 첫 줄 = 열 이름, 탭 또는 쉼표로 구분. 엑셀에서 복사해 붙여 넣어도 됩니다&#10;구분,적용 전(%),적용 후(%)&#10;ESWA MEB,0.171,0.144"></textarea>
    </div>
    <div class="buttons">
      <button id="save" class="primary">메모 저장</button>
      <button id="new">새 메모</button>
      <button id="delete" class="danger" disabled>삭제 표시</button>
    </div>
    <div id="daily-msg" class="msg"></div>
  </section>

  <section class="card">
    <h2><span class="step">2</span> 주간 정리 + PPT 생성</h2>
    <div class="buttons" style="margin-top:0">
      <button id="run" class="primary">실행</button>
      <button id="clear">이 주차 AI 응답 지우기</button>
      <span style="flex:1"></span>
      <select id="report-kind" title="보고 자료 (초안 템플릿)">
        <option value="exec">경영진 1장 요약 (선택 과제·주차)</option>
        <option value="monthly">월간 종합 보고 (이 주차가 속한 달, 전체 과제)</option>
      </select>
      <button id="run-report">보고 자료 생성</button>
    </div>
    <p class="hint">AI 응답이 없으면 EXAONE에 보낼 프롬프트를 보여 줍니다. 사내 AI(또는 다른 AI)에 붙여 넣어 받은 JSON을 아래에 넣고 저장하면 이어서 진행합니다.</p>
    <div id="run-msg" class="msg"></div>
    <div id="need" class="hidden">
      <div class="two">
        <div><b>보낼 프롬프트</b> <span id="need-name" class="hint"></span>
          <textarea id="prompt" class="mono" readonly style="min-height:300px"></textarea>
          <div class="buttons"><button id="copy">프롬프트 복사</button></div></div>
        <div><b>AI 응답 JSON 붙여넣기</b> <span class="hint">필요한 형식: <code id="need-format"></code></span>
          <textarea id="response" class="mono" style="min-height:300px" placeholder="{ ... } 형식의 JSON (```json 표시가 있어도 됩니다)"></textarea>
          <div class="buttons"><button id="save-response" class="primary">응답 저장 후 다시 실행</button></div>
          <div id="response-msg" class="msg"></div></div>
      </div>
    </div>
  </section>

  <section class="card hidden" id="result">
    <h2><span class="step">3</span> 결과</h2>
    <div class="files" id="files"></div>
    <div class="two" style="margin-top:12px">
      <div><b id="validation-title">의미 검증 보고서</b><pre id="validation"></pre></div>
      <div><b id="check-title">PPT 재검사</b><pre id="check"></pre></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let editingId = null;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function show(el, text, kind) { el.textContent = text; el.className = "msg show " + kind; }
function hide(el) { el.className = "msg"; }
function weekMonday(week) {
  const [y, w] = week.split("-W").map(Number);
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const monday = new Date(jan4); monday.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() + 6) % 7) + (w - 1) * 7);
  return monday;
}
function iso(d) { return d.toISOString().slice(0, 10); }

async function loadProjects() {
  const data = await api("/api/projects");
  $("project").innerHTML = data.projects.map(p => `<option value="${p.project_id}">${p.source === "worklog" ? `[WorkLog] ${p.name}` : `${p.project_id} · ${p.name}`}</option>`).join("");
}
async function loadDailies() {
  hide($("daily-msg"));
  const week = $("week").value.trim();
  const mon = weekMonday(week); const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
  $("range").textContent = `${iso(mon)} ~ ${iso(sun)}`;
  const data = await api(`/api/dailies?project_id=${encodeURIComponent($("project").value)}&week=${encodeURIComponent(week)}`);
  const body = $("dailies");
  body.innerHTML = "";
  if (!data.dailies.length) body.innerHTML = `<tr><td colspan="5" class="hint">이 주에 메모가 없습니다. 아래에서 추가하세요. (메모가 없으면 "변경 없음" 주간 보고가 만들어집니다)</td></tr>`;
  for (const d of data.dailies) {
    const tr = document.createElement("tr");
    tr.className = "row" + (d.excluded ? " excluded" : "");
    tr.innerHTML = `<td>${d.date}</td><td></td><td>${d.category || ""}</td><td></td>
      <td>${d.excluded ? `<span class="tag x">제외 · ${d.excluded}</span>` : `<span class="tag">정리 대상</span>`}${d.readonly ? ` <span class="tag">WorkLog</span>` : ""}</td>`;
    tr.children[1].textContent = d.author_name || d.author;
    tr.children[3].textContent = d.raw_text + (d.tables.length ? "  [표 포함]" : "");
    tr.children[3].style.whiteSpace = "pre-wrap";
    tr.onclick = () => d.readonly ? show($("daily-msg"), `${d.daily_id}: WorkLog 업무일지는 WorkLog 웹에서 수정합니다 (여기서는 읽기만 함).`, "info") : edit(d);
    body.appendChild(tr);
  }
  if (!editingId) $("f-date").value = iso(mon);
}
function edit(d) {
  editingId = d.daily_id;
  $("editing").textContent = `${d.daily_id} 수정 (rev ${d.meta.revision})`;
  $("f-date").value = d.date; $("f-author").value = d.author; $("f-visibility").value = d.visibility;
  $("f-category").value = d.category || ""; $("f-text").value = d.raw_text;
  $("f-table-title").value = d.table_title || ""; $("f-table").value = d.table_text || "";
  $("delete").disabled = !!d.deleted;
}
function resetForm() {
  editingId = null; $("editing").textContent = "새 메모"; $("delete").disabled = true;
  $("f-text").value = ""; $("f-table-title").value = ""; $("f-table").value = "";
  $("f-date").value = iso(weekMonday($("week").value.trim()));
}
async function saveDaily() {
  try {
    const data = await api("/api/daily", {daily_id: editingId, date: $("f-date").value, author: $("f-author").value.trim(),
      visibility: $("f-visibility").value, project_id: $("project").value, category: $("f-category").value,
      raw_text: $("f-text").value, table_title: $("f-table-title").value, table_text: $("f-table").value});
    resetForm(); await loadDailies();
    show($("daily-msg"), `저장했습니다: ${data.daily.daily_id} (rev ${data.daily.meta.revision}). 이 주의 AI 응답이 이미 있으면 '응답 지우기' 후 실행해야 새 메모가 반영됩니다.`, "ok");
  } catch (e) { show($("daily-msg"), e.message, "err"); }
}
async function deleteDaily() {
  if (!editingId || !confirm(`${editingId}를 삭제 표시할까요? (파일은 남고 정리 대상에서 빠집니다)`)) return;
  try { await api("/api/daily/delete", {daily_id: editingId}); resetForm(); await loadDailies(); show($("daily-msg"), "삭제 표시했습니다.", "ok"); }
  catch (e) { show($("daily-msg"), e.message, "err"); }
}
let lastRun = () => run();  // 붙여넣기 저장 후 다시 실행할 흐름 (주간 정리 또는 보고 자료)
async function run(report = false) {
  lastRun = () => run(report);
  const button = report ? $("run-report") : $("run");
  button.disabled = true; show($("run-msg"), "실행 중…", "info");
  try {
    const body = {project_id: $("project").value, week: $("week").value.trim(), mode: $("mode").value};
    const r = report ? await api("/api/report", {...body, kind: $("report-kind").value}) : await api("/api/run", body);
    if (r.status === "need_response") {
      $("result").classList.add("hidden");
      $("need").classList.remove("hidden");
      $("need-name").textContent = r.response_name; $("prompt").value = r.prompt; $("need-format").textContent = r.format || "";
      $("response").value = r.previous || ""; hide($("response-msg"));
      if (r.error) show($("run-msg"), `저장된 ${r.prompt_id} 응답을 쓸 수 없습니다: ${r.error}\n오른쪽 응답을 고치거나, 왼쪽 프롬프트로 AI 응답을 다시 받아 붙여 넣어 주세요. (다른 단계 응답은 그대로 둡니다)`, "err");
      else show($("run-msg"), `AI 응답이 필요합니다 (${r.prompt_id}). 왼쪽 프롬프트를 AI에 보내고, 받은 JSON을 오른쪽에 붙여 넣어 주세요.`, "info");
    } else if (r.status === "error") {
      $("result").classList.add("hidden");
      show($("run-msg"), `[${r.stage}] ${r.message}`, "err");
    } else {
      $("need").classList.add("hidden");
      show($("run-msg"), r.problems.length ? `PPT를 만들었지만 재검사 문제 ${r.problems.length}건이 있습니다 (아래 보고서)` : "완료: PPT 생성·재검사 통과", r.problems.length ? "err" : "ok");
      const f = r.files, link = (p, label) => `<a href="/files/${encodeURI(p)}" target="_blank">${label}</a>`;
      if (report) {
        $("files").innerHTML = `<b>${link(f.pptx, "보고 자료 PPT 다운로드")}</b>` + link(f.check, "검사 보고서");
        $("validation-title").textContent = "보고 자료 검사"; $("check-title").textContent = "";
        $("validation").textContent = r.check; $("check").textContent = "AI는 칸별 문장만 썼고, 표·숫자·색은 코드가 기준정보로 채웠습니다.\n검사를 통과하지 못한 칸은 [대체]로 표시되어 있습니다.";
      } else {
        $("files").innerHTML = `<b>${link(f.pptx, "PPT 다운로드")}</b>` + link(f.weekly, "weekly JSON") + link(f.cumulative, "cumulative JSON") + link(f.validation, "검증 보고서") + link(f.ppt_check, "PPT 검사");
        $("validation-title").textContent = "의미 검증 보고서"; $("check-title").textContent = "PPT 재검사";
        $("validation").textContent = r.validation; $("check").textContent = r.ppt_check;
      }
      $("result").classList.remove("hidden");
    }
  } catch (e) { show($("run-msg"), e.message, "err"); }
  button.disabled = false;
}
async function saveResponse() {
  try { await api("/api/response", {name: $("need-name").textContent, text: $("response").value}); }
  catch (e) { show($("response-msg"), e.message, "err"); return; }  // 저장 실패: 붙여넣기 칸을 그대로 두고 이유를 바로 아래에 표시
  hide($("response-msg")); await lastRun();
}
async function clearResponses() {
  if (!confirm("이 과제·주차의 AI 응답을 지울까요? 다음 실행 때 프롬프트부터 다시 시작합니다.")) return;
  try { const r = await api("/api/responses/clear", {project_id: $("project").value, week: $("week").value.trim()});
        show($("run-msg"), r.removed.length ? `지웠습니다: ${r.removed.join(", ")}` : "지울 응답이 없습니다.", "ok"); }
  catch (e) { show($("run-msg"), e.message, "err"); }
}
async function resetWorkspace() {
  if (!confirm("작업공간을 처음 상태(저장소 예시 + W40 데모)로 되돌릴까요?\n입력한 메모·응답·결과는 workspace_backups 폴더에 백업한 뒤 지웁니다.")) return;
  try {
    const r = await api("/api/reset", {}); resetForm(); clearRun(); await loadProjects(); await loadDailies();
    let text = "작업공간을 초기화했습니다." + (r.backup ? `\n백업: ${r.backup}` : "");
    if (r.locked.length) text += `\n열려 있어 지우지 못한 파일(그대로 둠): ${r.locked.join(", ")} — PowerPoint 등에서 닫은 뒤 필요하면 다시 초기화하세요.`;
    show($("daily-msg"), text, r.locked.length ? "info" : "ok");
  } catch (e) { show($("daily-msg"), e.message, "err"); }
}

function clearRun() { $("result").classList.add("hidden"); $("need").classList.add("hidden"); hide($("run-msg")); }
$("load").onclick = () => { resetForm(); clearRun(); loadDailies(); };
$("project").onchange = () => { resetForm(); clearRun(); loadDailies(); };
$("save").onclick = saveDaily; $("new").onclick = resetForm; $("delete").onclick = deleteDaily;
$("run").onclick = () => run(false); $("run-report").onclick = () => run(true); $("save-response").onclick = saveResponse; $("clear").onclick = clearResponses;
$("copy").onclick = async () => { $("prompt").select(); try { await navigator.clipboard.writeText($("prompt").value); } catch { document.execCommand("copy"); } };
$("reset").onclick = resetWorkspace;
loadProjects().then(loadDailies).catch(e => show($("daily-msg"), e.message, "err"));
</script>
</body>
</html>
